<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LuaTools local harness — store page</title>
  </head>
  <body>
    <script>
      // Variants: ?mode=bpm (default) | bpm-path-only | bpm-minimal | bpm-noheader | desktop
      // The URL of this page contains /gamepad/, so the plugin's URL signal is on for every
      // mode; the class below decides the rest.
      // Surface any uncaught error from the plugin instead of losing it in the console.
      window.__errs = [];
      window.addEventListener("error", function (e) {
        window.__errs.push((e.message || "") + " @" + (e.lineno || "?") + ":" + (e.colno || "?"));
      });

      var mode = new URLSearchParams(location.search).get("mode") || "bpm";
      document.documentElement.className =
        mode === "desktop"
          ? "DesktopUI"
          : mode === "bpm-path-only"
            ? ""
            : "BasicUI touch";

      function add(id, html) {
        var el = document.createElement("div");
        el.id = id;
        if (html) el.innerHTML = html;
        document.body.appendChild(el);
        return el;
      }

      // Hashed store header container the icon button goes into. Absent on Big Picture,
      // where the gamepad UI draws its own top bar.
      if (mode !== "bpm-noheader") {
        var header = add("store_nav_area", "<a>Store</a> <a>Library</a>");
        header.className = "_1wn1lBlAzl3HMRqS1llwie";
      }

      // New-design action containers the Big Picture button stack targets. The desktop store
      // has none of them.
      if (mode !== "desktop") {
        if (mode === "bpm-minimal") {
          add("gamepadPurchaseOptions");
        } else {
          add("FeatureTarget_interest-buttons",
            '<button class="btnv6_blue_hoverfade">Add to your wishlist</button>');
          add("FeatureTarget_purchase-options");
          add("gamepadPurchaseOptions");
        }
      }
      add("apphub_OtherSiteInfo");
    </script>

    <script>
      // Stand-in for the CDP bridge: window.Millennium is what the plugin's local shim calls
      // for the endpoints that really belong to the LuaTools app.
      window.__calls = [];
      var canned = {
        HasLuaToolsForApp: { success: true, exists: false },
        GetLuaToolsAddStatus: { success: true, state: { status: "idle" } },
        ReadLoadedApps: { success: true, apps: [] },
        GetInitApisMessage: { success: true, message: "" },
        CheckForUpdatesNow: { success: true, message: "No updates available." },
      };
      window.Millennium = {
        callServerMethod: function (plugin, method) {
          window.__calls.push(method);
          return Promise.resolve(JSON.stringify(canned[method] || { success: true }));
        },
      };

      // Deterministic standard-mapping gamepad (buttons 0-15, axes 0-3).
      window.__pad = {
        index: 0,
        id: "Fake pad (STANDARD GAMEPAD)",
        connected: true,
        axes: [0, 0, 0, 0],
        buttons: Array.from({ length: 16 }, function () {
          return { pressed: false, value: 0 };
        }),
      };
      Object.defineProperty(Navigator.prototype, "getGamepads", {
        configurable: true,
        value: function () {
          return [window.__pad];
        },
      });

      // Chromium suspends requestAnimationFrame in a hidden tab, and the plugin polls the pad
      // from rAF. When this page is opened in a background tab, drive the loop with a timer
      // instead so the checks still run; in a visible window nothing is changed.
      if (document.hidden) {
        window.requestAnimationFrame = function (cb) {
          return setTimeout(function () {
            cb(performance.now());
          }, 16);
        };
        window.cancelAnimationFrame = function (id) {
          clearTimeout(id);
        };
      }
    </script>
    <script src="../../../../public/luatools.js"></script>
  </body>
</html>
