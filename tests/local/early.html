<!doctype html>
<html class="BasicUI touch">
  <head>
    <meta charset="utf-8" />
    <title>LuaTools local harness — evaluated without &lt;head&gt;</title>
  </head>
  <body>
    <div id="store_nav_area" class="_1wn1lBlAzl3HMRqS1llwie">
      <a href="#">Store</a> <a href="#">Library</a>
    </div>
    <div class="apphub_OtherSiteInfo"></div>

    <script>
      window.__calls = [];
      window.Millennium = {
        callServerMethod: function (plugin, method) {
          window.__calls.push(method);
          return Promise.resolve(JSON.stringify({ success: true, exists: false }));
        },
      };
      Object.defineProperty(Navigator.prototype, "getGamepads", {
        configurable: true,
        value: function () {
          return [];
        },
      });
      // The store-home timing that used to abort the whole script:
      // document.head is gone when the plugin is evaluated.
      document.documentElement.removeChild(document.head);
      window.__headWasRemoved = document.head === null;
    </script>
    <script src="../../public/luatools.js"></script>
  </body>
</html>
